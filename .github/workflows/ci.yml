name: SnapShop CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: ⚙️ Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: 📦 Restore Dependencies
      run: dotnet restore SnapShop.Solution.sln

    - name: 🔨 Build Solution
      run: dotnet build SnapShop.Solution.sln --no-restore --configuration Release

    - name: 🧪 Execute Unit Tests
      run: dotnet test SnapShop.Solution.sln --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test_results.trx"
